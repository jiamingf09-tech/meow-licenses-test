name: Refresh signed authorization status
on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['v1/catalog.json', 'v1/delegation.json', 'v1/trust.json', 'automation/publish-status.mjs']
permissions:
  contents: write
concurrency:
  group: signed-license-status
  cancel-in-progress: false
jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Publish limited-lifetime status
        env:
          TRADINGMEOW_STATUS_PRIVATE_KEY: ${{ secrets.TRADINGMEOW_STATUS_PRIVATE_KEY }}
        run: node automation/publish-status.mjs
      - name: Commit status only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- v1/status.json
          git diff --cached --quiet && exit 0
          git commit -m 'Refresh signed authorization status'
          git push origin HEAD:main
